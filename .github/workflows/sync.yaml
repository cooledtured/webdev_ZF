# This will automatically sync the podcast episodes using github actions.

name: Sync Podcast Episodes

on:
  schedule:
    - cron: '0 8 * * 0' # 8 am on Sunday! :)
  workflow_dispatch: # And a manual sync

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14' # should work with any

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 html2text

      - name: Run podcast sync pythonscript
        run: python convert_rss_to_md.py

      - name: Commit and push generated markdown files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/posts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync podcast episodes [skip ci]" && git push)